# Cloud Run service configuration
# Use this file to deploy to Cloud Run manually or as reference

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ai-chat
  labels:
    cloud.googleapis.com/location: asia-northeast1
spec:
  template:
    metadata:
      annotations:
        # Autoscaling settings
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '10'
        # Cloud Run timeout
        run.googleapis.com/startup-cpu-boost: 'true'
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: gcr.io/PROJECT_ID/ai-chat:latest
          ports:
            - name: http1
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_TELEMETRY_DISABLED
              value: '1'
            - name: PORT
              value: '3000'
            - name: HOSTNAME
              value: '0.0.0.0'
          # Environment variables from Secret Manager
          # Replace with actual secret names in GCP
          envFrom:
            - secretRef:
                name: anthropic-api-key
            - secretRef:
                name: mongodb-uri
          resources:
            limits:
              cpu: '1'
              memory: 512Mi
          # Health check
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
